<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <h1>WELCOME TO THE FORM PAGE</h1>
    <form action="">
        First Name: <input type="text" name="first_name" placeholder="First Name" />
        <br>
        <br>
        Last Name: <input type="text" name="last_name" />
        <br>
        <br>
        Phone No.: <input type="number" name="phone" />
        <br>
        <br>
        Password: <input type="password" name="password" />
        <br>
        <br>
        <textarea name="about" placeholder="Tell us about yourself" rows="10" cols="32">
            Tell us about yourself
        </textarea>
        <br>
        <br>
        Gender:
        <input type="radio" name="gender" value="M" /> Male
        <input type="radio" name="gender" value="F" /> Female
        <input type="radio" name="gender" value="O" checked /> Others
        <br>
        <br>
        Favourite Color:
        <input type="checkbox" name="color" value="black" /> Black
        <input type="checkbox" name="color" value="yellow" /> Yellow
        <input type="checkbox" name="color" value="red" checked /> Red
        <br>
        <br>
        <input type="file" name="passport" accept="image/*" />
    </form>
</body>
</html>
